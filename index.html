<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Slideshow — 自訂秒數循環播放</title>
  <meta name="description" content="上傳多張相片，為每張設定播放秒數，全螢幕循環 slideshow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c12;
      --surface: #16161f;
      --surface2: #1e1e2a;
      --border: #2a2a3a;
      --text: #f0f0f5;
      --muted: #9898a8;
      --accent: #7c5cfc;
      --accent-hover: #9580ff;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ===== Setup Screen ===== */
    #setup {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header h1 span {
      background: linear-gradient(135deg, var(--accent), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Drop zone */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      background: var(--surface);
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
      margin-bottom: 28px;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(124, 92, 252, 0.08);
    }

    .dropzone .icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
      opacity: 0.85;
    }

    .dropzone h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .dropzone p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dropzone input[type="file"] {
      display: none;
    }

    /* Global duration */
    .global-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 24px;
    }

    .global-bar label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .global-bar input[type="number"] {
      width: 72px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }

    .global-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.12);
    }

    /* Photo list */
    .photo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .photo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .photo-item img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .photo-meta {
      flex: 1;
      min-width: 0;
    }

    .photo-meta .name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .photo-meta .duration-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .photo-meta .duration-row label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .photo-meta input[type="number"] {
      width: 64px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
    }

    .photo-meta input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .empty-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 24px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    /* ===== Slideshow Screen ===== */
    #slideshow {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
    }

    #slideshow.active {
      display: block;
    }

    .slide-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.45s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .slide-container img.fade-out {
      opacity: 0;
    }

    /* Controls overlay */
    .overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 20px 24px 28px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #slideshow:hover .overlay,
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-left {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 0.9rem;
    }

    .overlay-right {
      display: flex;
      gap: 10px;
    }

    .overlay .btn {
      pointer-events: auto;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(8px);
    }

    .overlay .btn:hover {
      background: rgba(255,255,255,0.28);
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      width: 0%;
      transition: width 0.05s linear;
    }

    /* Keyboard hint */
    .kb-hint {
      position: absolute;
      top: 16px;
      right: 20px;
      color: rgba(255,255,255,0.45);
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #slideshow:hover .kb-hint {
      opacity: 1;
    }

    @media (max-width: 560px) {
      header h1 { font-size: 1.45rem; }
      .photo-item { flex-wrap: wrap; }
      .photo-item img { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>
  <!-- Setup UI -->
  <div id="setup">
    <header>
      <h1>📷 <span>Photo Slideshow</span></h1>
      <p>上傳多張相片，為每張設定播放秒數，全螢幕循環播放</p>
    </header>

    <div class="dropzone" id="dropzone">
      <div class="icon">🖼️</div>
      <h2>點擊或拖曳相片到這裡</h2>
      <p>支援 JPG、PNG、GIF、WebP · 可一次選多張</p>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </div>

    <div class="global-bar" id="globalBar" style="display:none;">
      <label>預設每張播放</label>
      <input type="number" id="globalDuration" min="1" max="300" value="5" step="1" />
      <span style="color:var(--muted);font-size:0.9rem;">秒</span>
      <button class="btn btn-ghost" id="applyAllBtn" type="button">套用到全部</button>
      <span style="flex:1"></span>
      <span id="photoCount" style="color:var(--muted);font-size:0.9rem;"></span>
    </div>

    <div class="photo-list" id="photoList">
      <div class="empty-hint" id="emptyHint">尚未上傳任何相片</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="startBtn" disabled>▶ 開始播放</button>
      <button class="btn btn-ghost" id="clearBtn" style="display:none;">清除全部</button>
    </div>
  </div>

  <!-- Slideshow UI -->
  <div id="slideshow">
    <div class="progress-bar" id="progressBar"></div>
    <div class="kb-hint">← → 切換 · 空白鍵暫停 · Esc 結束</div>
    <div class="slide-container">
      <img id="slideImg" alt="" />
    </div>
    <div class="overlay" id="overlay">
      <div class="overlay-left">
        <span id="slideCounter">1 / 1</span>
        <span id="slideTimer"></span>
      </div>
      <div class="overlay-right">
        <button class="btn" id="prevBtn" type="button">‹ 上一張</button>
        <button class="btn" id="pauseBtn" type="button">⏸ 暫停</button>
        <button class="btn" id="nextBtn" type="button">下一張 ›</button>
        <button class="btn" id="exitBtn" type="button">✕ 結束</button>
      </div>
    </div>
  </div>

  <script>
    /** @type {{ id: string, file: File, url: string, duration: number }[]} */
    let photos = [];
    let currentIndex = 0;
    let timerId = null;
    let progressId = null;
    let isPaused = false;
    let slideStart = 0;
    let remainingMs = 0;

    const $ = (sel) => document.querySelector(sel);
    const dropzone = $('#dropzone');
    const fileInput = $('#fileInput');
    const photoList = $('#photoList');
    const emptyHint = $('#emptyHint');
    const globalBar = $('#globalBar');
    const globalDuration = $('#globalDuration');
    const photoCount = $('#photoCount');
    const startBtn = $('#startBtn');
    const clearBtn = $('#clearBtn');
    const applyAllBtn = $('#applyAllBtn');
    const slideshow = $('#slideshow');
    const slideImg = $('#slideImg');
    const progressBar = $('#progressBar');
    const slideCounter = $('#slideCounter');
    const slideTimer = $('#slideTimer');
    const pauseBtn = $('#pauseBtn');

    // ---- Upload ----
    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', () => {
      handleFiles(fileInput.files);
      fileInput.value = '';
    });

    function handleFiles(fileList) {
      const defaultDur = Math.max(1, parseInt(globalDuration.value, 10) || 5);
      const incoming = Array.from(fileList).filter(f => f.type.startsWith('image/'));

      for (const file of incoming) {
        const id = crypto.randomUUID();
        const url = URL.createObjectURL(file);
        photos.push({ id, file, url, duration: defaultDur });
      }

      renderList();
    }

    function renderList() {
      photoList.innerHTML = '';

      if (photos.length === 0) {
        photoList.appendChild(emptyHint);
        emptyHint.style.display = 'block';
        globalBar.style.display = 'none';
        clearBtn.style.display = 'none';
        startBtn.disabled = true;
        return;
      }

      emptyHint.style.display = 'none';
      globalBar.style.display = 'flex';
      clearBtn.style.display = 'inline-flex';
      startBtn.disabled = false;
      photoCount.textContent = `共 ${photos.length} 張`;

      photos.forEach((p, i) => {
        const item = document.createElement('div');
        item.className = 'photo-item';
        item.dataset.id = p.id;

        item.innerHTML = `
          <img src="${p.url}" alt="" />
          <div class="photo-meta">
            <div class="name" title="${escapeHtml(p.file.name)}">${escapeHtml(p.file.name)}</div>
            <div class="duration-row">
              <label>播放</label>
              <input type="number" min="1" max="300" step="1" value="${p.duration}" data-id="${p.id}" />
              <span style="color:var(--muted);font-size:0.8rem;">秒</span>
            </div>
          </div>
          <button class="btn btn-danger" type="button" data-remove="${p.id}">移除</button>
        `;

        photoList.appendChild(item);
      });

      // Duration change
      photoList.querySelectorAll('input[type="number"]').forEach(inp => {
        inp.addEventListener('change', () => {
          const id = inp.dataset.id;
          const val = Math.max(1, Math.min(300, parseInt(inp.value, 10) || 5));
          inp.value = val;
          const photo = photos.find(x => x.id === id);
          if (photo) photo.duration = val;
        });
      });

      // Remove
      photoList.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.remove;
          const idx = photos.findIndex(x => x.id === id);
          if (idx !== -1) {
            URL.revokeObjectURL(photos[idx].url);
            photos.splice(idx, 1);
            renderList();
          }
        });
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    applyAllBtn.addEventListener('click', () => {
      const val = Math.max(1, Math.min(300, parseInt(globalDuration.value, 10) || 5));
      globalDuration.value = val;
      photos.forEach(p => { p.duration = val; });
      renderList();
    });

    clearBtn.addEventListener('click', () => {
      photos.forEach(p => URL.revokeObjectURL(p.url));
      photos = [];
      renderList();
    });

    // ---- Slideshow ----
    startBtn.addEventListener('click', startSlideshow);
    $('#exitBtn').addEventListener('click', exitSlideshow);
    $('#prevBtn').addEventListener('click', () => goTo(currentIndex - 1));
    $('#nextBtn').addEventListener('click', () => goTo(currentIndex + 1));
    pauseBtn.addEventListener('click', togglePause);

    function startSlideshow() {
      if (photos.length === 0) return;
      currentIndex = 0;
      isPaused = false;
      pauseBtn.textContent = '⏸ 暫停';
      slideshow.classList.add('active');
      document.body.style.overflow = 'hidden';
      showSlide(0);
    }

    function exitSlideshow() {
      clearTimers();
      slideshow.classList.remove('active');
      document.body.style.overflow = '';
      progressBar.style.width = '0%';
    }

    function clearTimers() {
      if (timerId) { clearTimeout(timerId); timerId = null; }
      if (progressId) { clearInterval(progressId); progressId = null; }
    }

    function showSlide(index) {
      if (photos.length === 0) return;

      // Normalize index for looping
      currentIndex = ((index % photos.length) + photos.length) % photos.length;
      const photo = photos[currentIndex];

      slideImg.classList.add('fade-out');

      setTimeout(() => {
        slideImg.src = photo.url;
        slideImg.classList.remove('fade-out');
        slideCounter.textContent = `${currentIndex + 1} / ${photos.length}`;

        const durationMs = photo.duration * 1000;
        remainingMs = durationMs;
        slideStart = Date.now();

        if (!isPaused) {
          startProgress(durationMs);
          timerId = setTimeout(() => goTo(currentIndex + 1), durationMs);
        }

        slideTimer.textContent = `· ${photo.duration}s`;
      }, 200);
    }

    function startProgress(totalMs) {
      clearInterval(progressId);
      progressBar.style.width = '0%';
      const start = Date.now();

      progressId = setInterval(() => {
        if (isPaused) return;
        const elapsed = Date.now() - start;
        const pct = Math.min(100, (elapsed / totalMs) * 100);
        progressBar.style.width = pct + '%';
        if (pct >= 100) clearInterval(progressId);
      }, 40);
    }

    function goTo(index) {
      clearTimers();
      showSlide(index);
    }

    function togglePause() {
      if (isPaused) {
        // Resume
        isPaused = false;
        pauseBtn.textContent = '⏸ 暫停';
        slideStart = Date.now();
        startProgress(remainingMs);
        timerId = setTimeout(() => goTo(currentIndex + 1), remainingMs);
      } else {
        // Pause
        isPaused = true;
        pauseBtn.textContent = '▶ 繼續';
        remainingMs = Math.max(0, remainingMs - (Date.now() - slideStart));
        clearTimers();
      }
    }

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (!slideshow.classList.contains('active')) return;

      if (e.key === 'Escape') {
        exitSlideshow();
      } else if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        if (e.key === ' ') togglePause();
        else goTo(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        goTo(currentIndex - 1);
      }
    });

    // Keep overlay visible briefly on touch
    let overlayTimer;
    slideshow.addEventListener('touchstart', () => {
      const overlay = $('#overlay');
      overlay.classList.add('show');
      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => overlay.classList.remove('show'), 3000);
    });
  </script>
</body>
</html>
